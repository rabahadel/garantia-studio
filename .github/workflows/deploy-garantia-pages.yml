name: CI/CD GarantIA (Build .NET & Deploy GitHub Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-dotnet:
    name: Build Moteur .NET 10 (GarantIA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build GarantIA
        working-directory: 07-garantia-mvp-net8
        run: |
          dotnet restore GarantIA.csproj
          dotnet build GarantIA.csproj --configuration Release --no-restore

  deploy-pages:
    name: Deploy WebDemo Smoke-Test to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebDemo Artifact (index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '07-garantia-mvp-net8/WebDemo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
